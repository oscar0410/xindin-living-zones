<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新店區生活圈範圍地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --ink: #1b2430;
    --paper: #f7f8f6;
    --line: #d8dcd6;
    --accent: #2f6f5e;
    --accent-soft: #e4efe9;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--sans); color: var(--ink); background: var(--paper); }

  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  #sidebar {
    border-right: 1px solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar header {
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--line);
  }
  #sidebar header .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  #sidebar header h1 {
    font-size: 19px;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  #sidebar header p {
    font-size: 12.5px;
    color: #5b6570;
    margin: 0;
    line-height: 1.5;
  }
  #zone-count {
    font-family: var(--mono);
    font-size: 12px;
    color: #5b6570;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
  }
  #zone-count b { color: var(--ink); font-size: 15px; }

  #zone-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .zone-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 22px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .zone-item:hover { background: var(--accent-soft); }
  .zone-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .swatch {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .zone-name { font-size: 13.5px; }
  .zone-item .zone-note {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: #9aa3ab;
  }

  #footer-note {
    padding: 12px 22px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: #8a939c;
    line-height: 1.6;
  }

  #map { width: 100%; height: 100%; background: #eef1ee; }

  .leaflet-popup-content-wrapper { border-radius: 6px; }
  .popup-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .popup-sub { font-family: var(--mono); font-size: 11px; color: #6b7480; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>

const palette = [
  '#2f6f5e', '#c9622d', '#3f6fb0', '#a34a7c', '#8a8f2f',
  '#4a8fa8', '#b5502f', '#5a6fc0', '#2f9e6e', '#c08a2f',
  '#7a4fae', '#3f8f3f', '#c04f5a', '#5f7d3f'
];

const map = L.map('map', { zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const zoneLayers = {};
const zoneListEl = document.getElementById('zone-list');
let activeName = null;

function colorFor(i) { return palette[i % palette.length]; }

function setActive(name) {
  activeName = name;
  document.querySelectorAll('.zone-item').forEach(el => {
    el.classList.toggle('active', el.dataset.name === name);
  });
}

geojsonData.features.forEach((feature, i) => {
  const name = feature.properties['生活圈'] || '(未命名)';
  const district = feature.properties['行政區'] || '';
  const color = colorFor(i);

  const layer = L.geoJSON(feature, {
    style: {
      color: color,
      weight: 1.6,
      fillColor: color,
      fillOpacity: 0.32,
      opacity: 0.85
    }
  }).addTo(map);

  layer.bindPopup('<div class="popup-title">' + name + '</div>');

  layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.55, weight: 2.4 }));
  layer.on('mouseout', () => layer.setStyle({ fillOpacity: 0.32, weight: 1.6 }));
  layer.on('click', () => { setActive(name); map.fitBounds(layer.getBounds(), { maxZoom: 16 }); });

  zoneLayers[name] = layer;

  const item = document.createElement('div');
  item.className = 'zone-item';
  item.dataset.name = name;
  item.innerHTML =
    '<span class="swatch" style="background:' + color + '"></span>' +
    '<span class="zone-name">' + name + '</span>';
  item.addEventListener('click', () => {
    setActive(name);
    map.fitBounds(layer.getBounds(), { maxZoom: 16 });
    layer.openPopup(layer.getBounds().getCenter());
  });
  zoneListEl.appendChild(item);
});

document.getElementById('zone-count-num').textContent = geojsonData.features.length;

const allLayers = Object.values(zoneLayers);
if (allLayers.length) {
  const group = L.featureGroup(allLayers);
  map.fitBounds(group.getBounds(), { padding: [24, 24] });
} else {
  map.setView([24.98, 121.53], 13);
}
